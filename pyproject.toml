[project]
name = "poster-core"
version = "0.1.0"
description = "Visual News Intelligence engine: turn articles, feeds and custom content into publication-ready social visuals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
    "pillow>=10.0",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]
extraction = ["trafilatura>=1.8"]
all = ["openai>=1.40", "google-genai>=1.0", "trafilatura>=1.8"]

[project.scripts]
poster = "poster_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poster_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
